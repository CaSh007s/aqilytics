name: Wake Backend

on:
  schedule:
    # Runs at 7:55 AM UTC every day (5 minutes before the Vercel cron job)
    - cron: "55 7 * * *"
  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Render Backend
        run: |
          echo "Waking up the backend at aqilytics.onrender.com..."
          curl -s -o /dev/null -w "%{http_code}" https://aqilytics.onrender.com/api/v1/aqi/predict?city=London || echo "Ping attempted"
          echo -e "\nBackend ping complete!"
