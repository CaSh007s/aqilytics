version: "3.8"

services:
  redis:
    image: redis:alpine
    container_name: aeronomy-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  # Database (Optional for Day 1, but good to have ready)
  db:
    image: postgres:15-alpine
    container_name: aeronomy-db
    environment:
      POSTGRES_USER: aeronomy_user
      POSTGRES_PASSWORD: aeronomy_pass
      POSTGRES_DB: aeronomy_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  redis_data:
  postgres_data:
